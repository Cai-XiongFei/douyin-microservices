syntax = "proto3";

package comment;

option go_package = "comment";

import "user.proto";

// 评论信息
message Comment {
  int64 id = 1;
  user.User user = 2;
  string content = 3;
  string create_date = 4;
}

// 发布或者删除评论
message CommentActionRequest {
  string token = 1;
  int64 video_id = 2;

  // 1：发布评论，2：删除评论
  int32 action_type = 3;

  // 发布评论时使用
  string comment_text = 4;

  // 删除评论时使用
  int64 comment_id = 5;
}

message CommentActionResponse {
  int32 status_code = 1;
  string status_msg = 2;
  Comment comment = 3;
}

// 查询视频评论列表
message CommentListRequest {
  string token = 1;
  int64 video_id = 2;
}

message CommentListResponse {
  int32 status_code = 1;
  string status_msg = 2;
  repeated Comment comment_list = 3;
}

service CommentService {
  rpc CommentAction(CommentActionRequest)
      returns (CommentActionResponse);

  rpc CommentList(CommentListRequest)
      returns (CommentListResponse);
}