services:
  mysql:
    image: mysql:8.0.32
    container_name: douyin-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_tiktok
      MYSQL_USER: tiktokDB
      MYSQL_PASSWORD: tiktokDB
    ports:
      - "3309:3306"
      - "3310:3306"
      - "3308:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - douyin_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  etcd:
    image: quay.io/coreos/etcd:v3.5.21
    container_name: douyin-etcd
    restart: unless-stopped
    ports:
      - "12379:2379"
      - "12380:2380"
    command:
      - /usr/local/bin/etcd
      - --name=s1
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://0.0.0.0:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://0.0.0.0:2380
      - --initial-cluster=s1=http://0.0.0.0:2380
      - --initial-cluster-token=douyin-etcd
      - --initial-cluster-state=new
    volumes:
      - douyin_etcd_data:/etcd-data

  minio:
    image: quay.io/minio/minio:latest
    container_name: douyin-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: tiktokMinio
      MINIO_ROOT_PASSWORD: tiktokMinio
    command: server /data --console-address ":9001"
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - douyin_minio_data:/data
  
  redis:
    image: redis:7.2-alpine
    container_name: douyin-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - tiktokRedis
    ports:
      - "16379:6379"
    volumes:
      - douyin_redis_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a tiktokRedis ping | grep PONG"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: douyin-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: tiktok
      RABBITMQ_DEFAULT_PASS: tiktokRabbitMQ
    ports:
      - "15672:5672"
      - "15673:15672"
    volumes:
      - douyin_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test:
        [
          "CMD",
          "rabbitmq-diagnostics",
          "-q",
          "ping"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
  nginx:
    image: nginx:1.27-alpine
    container_name: douyin-nginx
    restart: unless-stopped
    ports:
      - "18080:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  douyin_mysql_data:
  douyin_etcd_data:
  douyin_minio_data:
  douyin_redis_data:
  douyin_rabbitmq_data:
